name: 情報の更新　

on:
  schedule:
    - cron: "7,37 * * * *"   # 30分ごと（GitHubの混雑で数分〜十数分遅れることがある）
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_info.py"
      - ".github/workflows/info.yml"

permissions:
  contents: write

concurrency:
  group: info
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_info.py
      - name: 変更があれば保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/info.json
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "情報を更新"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 5; done
          exit 1
